name: Build and publish private npm package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish OpenClaw
    runs-on:
      - pacman-build
    env:
      NPM_REGISTRY: https://git.heliasar.com/api/packages/bex/npm/
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and pack OpenClaw
        id: pack
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          pnpm pack --pack-destination ci-artifacts
          mapfile -t TARBALLS < <(find ci-artifacts -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "Expected exactly one packed tarball, found ${#TARBALLS[@]}." >&2
            exit 1
          fi
          TARBALL="$PWD/${TARBALLS[0]}"
          PACKED_VERSION="$(tar -xOf "$TARBALL" package/package.json | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version));')"
          test "$PACKED_VERSION" = "${{ steps.version.outputs.version }}"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish to private npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "registry=${NPM_REGISTRY}" \
            "//git.heliasar.com/api/packages/bex/npm/:_authToken=\${NODE_AUTH_TOKEN}" \
            "always-auth=true" > "$RUNNER_TEMP/npmrc"
          npm publish "${{ steps.pack.outputs.tarball }}" \
            --userconfig "$RUNNER_TEMP/npmrc" \
            --registry "$NPM_REGISTRY" \
            --tag latest

      - name: Report published package
        run: |
          {
            echo "### Private OpenClaw package published"
            echo
            echo "- Package: \`openclaw@${{ steps.version.outputs.version }}\`"
            echo "- Registry tag: \`latest\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
