name: Build and publish private npm package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish OpenClaw
    runs-on:
      - pacman-build
    env:
      NPM_REGISTRY: https://git.heliasar.com/api/packages/bex/npm/
      SAGA_DEPLOY_HOST: 172.17.0.1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assign immutable private package version
        id: version
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(node -p "require('./package.json').version")"
          RUN_ID="${GITHUB_RUN_ID:?GITHUB_RUN_ID is required}"
          BASE_VERSION="${SOURCE_VERSION%%-*}"
          PACKAGE_VERSION="${BASE_VERSION}-${RUN_ID}"
          echo "source_version=$SOURCE_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and pack OpenClaw
        id: pack
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          pnpm run prepack
          npm version "${{ steps.version.outputs.package_version }}" \
            --no-git-tag-version \
            --ignore-scripts
          pnpm --config.ignore-scripts=true pack --pack-destination ci-artifacts
          mapfile -t TARBALLS < <(find ci-artifacts -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#TARBALLS[@]}" -ne 1 ]]; then
            echo "Expected exactly one packed tarball, found ${#TARBALLS[@]}." >&2
            exit 1
          fi
          TARBALL="$PWD/${TARBALLS[0]}"
          PACKED_VERSION="$(tar -xOf "$TARBALL" package/package.json | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version));')"
          test "$PACKED_VERSION" = "${{ steps.version.outputs.package_version }}"
          node scripts/check-openclaw-package-tarball.mjs "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish to private npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "registry=${NPM_REGISTRY}" \
            "//git.heliasar.com/api/packages/bex/npm/:_authToken=\${NODE_AUTH_TOKEN}" \
            "always-auth=true" > "$RUNNER_TEMP/npmrc"
          npm publish "${{ steps.pack.outputs.tarball }}" \
            --userconfig "$RUNNER_TEMP/npmrc" \
            --registry "$NPM_REGISTRY" \
            --tag latest

      - name: Deploy and verify Saga-Sky
        env:
          SAGA_DEPLOY_SSH_KEY_B64: ${{ secrets.SAGA_DEPLOY_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/saga-deploy-ssh"
          install -d -m 0700 "$SSH_DIR"
          printf '%s' "$SAGA_DEPLOY_SSH_KEY_B64" | base64 --decode > "$SSH_DIR/id_ed25519"
          chmod 0600 "$SSH_DIR/id_ed25519"
          install -m 0600 .gitea/saga-known-hosts "$SSH_DIR/known_hosts"
          ssh \
            -i "$SSH_DIR/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "ubuntu@$SAGA_DEPLOY_HOST" \
            "deploy-openclaw ${{ steps.version.outputs.package_version }} ${{ steps.version.outputs.source_version }} $GITHUB_SHA"

      - name: Report published package
        run: |
          {
            echo "### Private OpenClaw package published"
            echo
            echo "- Package: \`openclaw@${{ steps.version.outputs.package_version }}\`"
            echo "- Runtime release: \`${{ steps.version.outputs.source_version }}\`"
            echo "- Registry tag: \`latest\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Saga-Sky: deployed and healthy"
          } >> "$GITHUB_STEP_SUMMARY"
