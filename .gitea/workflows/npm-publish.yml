name: Deploy published private npm package

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Immutable openclaw package version already published from the development machine
        required: true
        type: string
      source_version:
        description: OpenClaw source release version embedded in the package
        required: true
        type: string
      commit_sha:
        description: Full source commit SHA represented by the package
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Install and verify OpenClaw on Saga
    runs-on:
      - pacman-build
    env:
      SAGA_DEPLOY_HOST: 172.17.0.1
    steps:
      - name: Check out deployment trust material
        uses: actions/checkout@v4

      - name: Deploy and verify Saga-Sky
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          SAGA_DEPLOY_SSH_KEY_B64: ${{ secrets.SAGA_DEPLOY_SSH_KEY_B64 }}
          SOURCE_COMMIT_SHA: ${{ inputs.commit_sha }}
          SOURCE_VERSION: ${{ inputs.source_version }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}[-.][0-9A-Za-z.-]+$ ]]
          [[ "$SOURCE_VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          SSH_DIR="$RUNNER_TEMP/saga-deploy-ssh"
          install -d -m 0700 "$SSH_DIR"
          printf '%s' "$SAGA_DEPLOY_SSH_KEY_B64" | base64 --decode > "$SSH_DIR/id_ed25519"
          chmod 0600 "$SSH_DIR/id_ed25519"
          install -m 0600 .gitea/saga-known-hosts "$SSH_DIR/known_hosts"
          ssh \
            -i "$SSH_DIR/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "ubuntu@$SAGA_DEPLOY_HOST" \
            "deploy-openclaw $PACKAGE_VERSION $SOURCE_VERSION $SOURCE_COMMIT_SHA"

      - name: Report deployed package
        run: |
          {
            echo "### Published OpenClaw package deployed"
            echo
            echo "- Package: \`openclaw@${{ inputs.package_version }}\`"
            echo "- Runtime release: \`${{ inputs.source_version }}\`"
            echo "- Commit: \`${{ inputs.commit_sha }}\`"
            echo "- Saga-Sky: installed and healthy"
          } >> "$GITHUB_STEP_SUMMARY"
